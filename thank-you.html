<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thank You | Chemo Graphic International</title>
    <meta name="description" content="Thank you for contacting Chemo Graphic International." />
    <link rel="icon" type="image/png" href="/assets/img/Chemo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
    <header class="site-header scrolled" id="siteHeader" data-header-mode="solid">
        <div class="container header-inner">
            <a href="/" class="brand">
                <img src="/assets/img/Chemo.png" alt="Chemo Graphic International logo" class="brand-logo" />
                <span class="brand-text">
                    <span class="brand-name">CHEMO GRAPHIC</span>
                    <span class="brand-sub">INTERNATIONAL</span>
                </span>
            </a>
            <a href="/" class="btn btn-gold">Back Home</a>
        </div>
    </header>

    <main class="section" style="min-height: calc(100vh - 88px); display: flex; align-items: center;">
        <div class="container" style="max-width: 760px;">
            <p class="section-eyebrow">Message received</p>
            <h1 class="section-title">Thanks for reaching out.</h1>
            <p class="section-desc">
                Your enquiry has been submitted through Netlify Forms. Once you enable form notifications in Netlify,
                submissions can be emailed to <a href="mailto:info@chemo.in">info@chemo.in</a> without any backend code.
            </p>
            <div style="margin-top: 28px;">
                <a href="/" class="btn btn-gold">Return Home</a>
            </div>
        </div>
    </main>

    <script src="/assets/js/main.js"></script>
</body>
</html>
